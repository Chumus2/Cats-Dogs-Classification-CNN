services:
  train:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cat_dog_trainer
    shm_size: '2gb'
    volumes:
      - ../cv:/app/cv
    command: python cv/src/train.py
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cat_dog_backend
    ports:
      - "8000:8000"
    command: uvicorn cv.src.api:app --host 0.0.0.0 --port 8000
    volumes:
      - ../cv:/app/cv
    depends_on:
      train:
        condition: service_completed_successfully

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cat_dog_frontend
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    volumes:
      - ../cv:/app/cv
      - ../app.py:/app/app.py
    environment:
      - API_URL=http://backend:8000/predict
    depends_on:
      - backend
    restart: always
